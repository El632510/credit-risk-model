name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn mlflow fastapi uvicorn pydantic pytest flake8

      - name: Run linter (flake8)
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: Run unit tests (pytest)
        run: pytest tests/ -v